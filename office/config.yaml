# AI Office 설정 — 2027_F1tenth_test
# 본체는 중앙 레포 tkddn647-ship-it/ai-office. 이 레포는 이 설정만 가진다.
# engine: claude | cursor | gemini  (fallback_engine: 실패하면 대신 쓸 엔진)

# 모든 작업은 이 브랜치에서 (CLAUDE.md 규칙). PR도 이 브랜치로 올라갑니다.
base_branch: feat/mapless40-asym-sac

max_tasks: 3
max_diff_chars: 60000

# 실행 전 준비 (GitHub 서버에서 매번): 프로젝트 테스트용 의존성 (CLAUDE.md §2).
# torch는 CPU 전용 빌드 (기본 빌드는 GPU 라이브러리 ~2GB)
setup_commands:
  - pip install -q torch --index-url https://download.pytorch.org/whl/cpu
  - pip install -q "stable-baselines3>=2.3" "gymnasium>=0.29" numpy scipy pyyaml pillow matplotlib tensorboard

# Builder가 끝난 뒤 오케스트레이터가 직접 돌리는 테스트 (CLAUDE.md §2, §7 "커밋 전 tests")
# Builder 보고와 별개의 객관적 확인. 결과는 PR과 리뷰어에게 전달됩니다.
# test_discover: __init__.py가 있는 패키지의 tests.py를 자동으로 찾아 `python -m 패키지.tests` 실행.
#   → 지금은 mapless40, camera.camfly, camera.depthfly(극성 검사 포함), lidarfly. 새 패키지도 자동 포함.
#   (camera.depthfly.polarity 단독 실행은 실패해도 exit 0이라 넣지 않음)
test_discover: true
test_exclude:            # 탐색에서 뺄 폴더 (실차 ROS 테스트는 CI에서 못 돌림)
  - Roboracer-2026-main
  - realcar
  - sim_ros2
test_commands: []        # 자동 탐색 외에 추가로 돌릴 명령이 있으면 여기에
test_timeout_sec: 900

# PR에 "/ai-office fix" 댓글로 돌리는 수정 라운드 최대 횟수 (PR 하나당)
max_fix_rounds: 2

project_notes: |
  - 작업 전에 레포 루트의 CLAUDE.md를 먼저 읽고 그 규칙을 따른다.
  - 실차 코드는 이슈가 그 폴더를 명시적으로 지목할 때만 수정한다:
      Roboracer-2026-main/ (실차 ROS2 스택), realcar/ (실차 실행 스크립트).
    실차 코드는 이 CI에서 실행·검증할 수 없으므로, 수정했다면 "실차 미검증"이라고 반드시 적는다.
  - 레포 루트의 레거시 파일(train_sac_*.py, f1tenth_mapless_env.py, connectome_*.py, watch_*.py 등)은 새 작업에 쓰지 않는다.
  - 모든 명령은 레포 루트에서 `python -m 패키지.모듈` 형태로 실행한다.
  - 테스트: 바꾼 패키지의 `python -m 패키지.tests` (예: mapless40, camera.camfly, camera.depthfly, lidarfly).
    새 패키지를 만들면 그 안에 tests.py(실패 시 exit 1)를 함께 만든다 — CI가 자동으로 찾아 돌린다.
    관련 테스트를 돌려 결과(통과 수)를 보고에 적는다.
  - 학습(train)은 실행하지 않는다. CI에는 GPU가 없고 시간이 오래 걸린다. 학습이 필요한 작업이면 코드만 바꾸고 "학습 필요"라고 적는다.
  - 학습 결과물(*.zip, 모델 파일)·맵·로그 데이터는 수정하거나 지우지 않는다.
  - 추정값과 실측값을 섞지 않는다. 수치를 바꾸면 근거(데이터시트/실측/추정)를 적는다.
  - 커밋 메시지, 보고, 리뷰는 한국어로.

roles:
  planner:
    engine: claude
    model: sonnet
    max_turns: 10          # 레포가 커서 기본보다 약간 여유
    allowed_tools: [Read, Grep, Glob]
    timeout_sec: 900

  builder:
    engine: cursor
    model: ""              # 비우면 계정 기본 모델. `cursor-agent models`로 목록 확인
    extra_args: ["--force", "--trust"]   # "unknown option" 오류가 나면 해당 플래그 삭제
    timeout_sec: 1800

  # 교차 리뷰: 기획(Claude)·구현(Cursor)과 다른 회사 모델. Gemini가 안 되면(키 없음·한도) Claude로 대신.
  # 공개 레포라 코드가 Gemini 무료 등급(사람 검토 가능)에 가도 추가로 드러나는 것은 없다.
  reviewer:
    engine: gemini
    model: ""              # 비우면 gemini-flash-latest
    timeout_sec: 900
    fallback_engine: claude
    fallback:
      model: sonnet
      max_turns: 6
      allowed_tools: [Read, Grep, Glob]
