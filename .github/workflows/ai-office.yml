name: AI Office

on:
  # 이슈에 "ai-office" 라벨을 붙이면 실행
  issues:
    types: [labeled]
  # Actions 탭에서 수동 실행 (이슈 번호 입력)
  workflow_dispatch:
    inputs:
      issue_number:
        description: "처리할 이슈 번호"
        required: true

# 한 번에 하나만 실행 → 구독 한도를 동시에 태우지 않음
concurrency:
  group: ai-office
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  office:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-office'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          pip install pyyaml
          # 프로젝트 테스트용 의존성 (CLAUDE.md §2). torch는 CPU 전용 빌드로 (기본 빌드는 GPU 라이브러리 ~2GB)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "stable-baselines3>=2.3" "gymnasium>=0.29" numpy scipy pillow matplotlib tensorboard
          npm install -g @anthropic-ai/claude-code
          curl https://cursor.com/install -fsS | bash
          # 설치 경로가 버전마다 달라서 둘 다 추가
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Check tools
        run: |
          claude --version
          cursor-agent --version

      # office/를 임시 폴더로 복사: 작업 브랜치(base_branch)에 office/가 없어도 실행되고, 로그가 커밋에 섞이지 않음
      - name: Stage AI Office
        run: |
          cp -r office "$RUNNER_TEMP/office"
          mkdir -p "$RUNNER_TEMP/ai-office-logs"

      - name: Run AI Office
        env:
          # Claude Pro 구독 토큰 (`claude setup-token`으로 발급)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cursor 대시보드에서 발급한 API 키
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          AI_OFFICE_REPO_ROOT: ${{ github.workspace }}
          AI_OFFICE_LOG_DIR: ${{ runner.temp }}/ai-office-logs
        run: python "$RUNNER_TEMP/office/orchestrator.py"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-office-logs
          path: ${{ runner.temp }}/ai-office-logs/
          if-no-files-found: ignore
